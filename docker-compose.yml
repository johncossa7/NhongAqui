services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhongaqui}
      POSTGRES_USER: ${POSTGRES_USER:-nhongaqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nhongaqui}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nhongaqui} -d ${POSTGRES_DB:-nhongaqui}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nhongaqui}:${POSTGRES_PASSWORD:-nhongaqui}@postgres:5432/${POSTGRES_DB:-nhongaqui}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  backend_media:
